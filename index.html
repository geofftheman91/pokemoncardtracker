<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Card Collection Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans">
  <div class="max-w-6xl mx-auto">
	
	<!-- Top Bar -->
	<header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
	  <div>
		<h1 class="text-3xl font-black tracking-tight text-amber-400">⚡ Pokémon Card Vault</h1>
		<p class="text-slate-400 text-sm mt-0.5">Live two-way sync with Google Sheets</p>
	  </div>

	  <!-- Set Progress -->
	  <div class="w-full sm:w-64 bg-slate-900 border border-slate-800 p-3 rounded-xl">
		<div class="flex justify-between text-xs font-semibold mb-1.5">
		  <span id="progress-label" class="text-slate-400">Set Completion</span>
		  <span id="progress-text" class="text-amber-400 font-mono">0/0 (0%)</span>
		</div>
		<div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
		  <div id="progress-bar" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%"></div>
		</div>
	  </div>
	</header>

	<!-- Set Navigation Tabs -->
	<div id="set-tabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 border-b border-slate-800 scrollbar-none">
	  <span class="text-xs text-slate-500 py-1.5">Loading sets...</span>
	</div>

	<!-- Controls: Search & Variant Filters -->
	<div class="flex flex-col sm:flex-row gap-3 mb-6">
	  <input 
		id="search" 
		type="text" 
		placeholder="Search card name or number (e.g. 001/086)..." 
		class="flex-1 bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 placeholder:text-slate-500"
	  />
	  <select id="owned-filter" class="bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 text-slate-300">
		<option value="all">All Status</option>
		<option value="owned">Owned Only</option>
		<option value="missing">Missing Only</option>
	  </select>
	  <select id="foil-filter" class="bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 text-slate-300">
		<option value="all">All Variants</option>
		<option value="Standard">Standard</option>
		<option value="Reverse Holo">Reverse Holo</option>
		<option value="Holo">Holo</option>
	  </select>
	</div>

	<!-- Card Grid -->
	<div id="card-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
	  <div class="col-span-full py-16 text-center text-slate-500 text-sm">Connecting to Google Sheets...</div>
	</div>
  </div>

  <script>
	// ==========================================
	// 1. CONFIGURATION & STATE
	// ==========================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhCGRmOFESJPMGkEGpejCzD6rx26dn7QU0lPUhR8Bfw-2S2ZVIkOt6RJQGnCpmrWpDbA/exec";	let allCards = [];
	let sets = [];
	let activeSet = "";
	const CARDS_PER_PAGE = 40;
	let currentPage = 1;

	// ==========================================
	// 2. GLOBAL TOGGLE FUNCTION (EXPOSED TO WINDOW)
	// ==========================================
	window.toggleCard = async function(set, rowIndex, currentStatus) {
	  console.log(`[Toggle] Set: "${set}", Row: ${rowIndex}, Current: ${currentStatus}`);

	  // Locate card in local state using loose number comparison
	  const target = allCards.find(c => c.set.trim() === set.trim() && Number(c.rowIndex) === Number(rowIndex));
	  if (!target) {
		console.error("Target card not found in memory!", { set, rowIndex });
		return;
	  }

	  const nextStatus = !currentStatus;

	  // Optimistic UI Update (immediate feedback on screen)
	  target.owned = nextStatus;
	  renderCards();

	  // Sync to Google Sheets
	  try {
		const payload = JSON.stringify({
		  set: set,
		  rowIndex: Number(rowIndex),
		  owned: nextStatus
		});

		const res = await fetch(SCRIPT_URL, {
		  method: "POST",
		  headers: { "Content-Type": "text/plain;charset=utf-8" },
		  body: payload,
		  redirect: "follow"
		});

		const result = await res.json();
		console.log("Sheet update response:", result);
	  } catch (err) {
		console.error("Sync failed:", err);
		target.owned = currentStatus; // Revert on failure
		renderCards();
	  }
	};

	// ==========================================
	// 3. SET SWITCHING & TABS
	// ==========================================
	window.switchSet = function(setName) {
	  activeSet = setName;
	  currentPage = 1;
	  renderTabs();
	  renderCards();
	};

	function renderTabs() {
	  const container = document.getElementById("set-tabs");
	  container.innerHTML = sets.map(setName => {
		const isActive = setName === activeSet;
		return `
		  <button 
			type="button"
			onclick="window.switchSet('${setName.replace(/'/g, "\\'")}')"
			class="px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
			  isActive 
				? 'bg-amber-400 text-slate-950 shadow' 
				: 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
			}">
			${setName}
		  </button>
		`;
	  }).join('');
	}

	// ==========================================
	// 4. IMAGE PATH RESOLUTION
	// ==========================================
	function getCardImageSrc(card) {
	  if (card.image_url) return card.image_url;

	  const setFolders = {
		"Journey Together": "CardImages/journey-together-images",
		"Destined Rivals": "CardImages/destined-rivals-images",
		"Perfect Order": "CardImages/perfect-order-images",
		"Pitch Black": "CardImages/pitch-black-images",
		"Surging Sparks": "CardImages/surging-sparks-images",
		"Chaos Rising": "CardImages/chaos-rising-images"
	  };

	  const folder = setFolders[card.set ? card.set.trim() : ""];
	  if (!folder || !card.cardNumber) return "";

	  const rawNum = String(card.cardNumber).split("/")[0].trim();
	  const cleanNum = rawNum.replace(/^0+/, "") || "0";

	  const foilNorm = (card.foil || "standard")
		.trim()
		.toLowerCase()
		.replace(/\s+/g, "_");

	  return `${folder}/${cleanNum}_${foilNorm}.png`;
	}

	// ==========================================
	// 5. CARD RENDERING
	// ==========================================
	function renderCards() {
	  const query = document.getElementById("search").value.toLowerCase();
	  const ownedFilter = document.getElementById("owned-filter").value;
	  const foilFilter = document.getElementById("foil-filter").value;

	  const currentSetCards = allCards.filter(c => c.set === activeSet);

	  const filtered = currentSetCards.filter(c => {
		const matchesQuery = c.name.toLowerCase().includes(query) || c.cardNumber.toLowerCase().includes(query);
		const matchesOwned = ownedFilter === "all" ? true : ownedFilter === "owned" ? c.owned : !c.owned;
		const matchesFoil = foilFilter === "all" ? true : c.foil.toLowerCase() === foilFilter.toLowerCase();
		return matchesQuery && matchesOwned && matchesFoil;
	  });

	  // Update Header Progress Bar
	  const ownedCount = currentSetCards.filter(c => c.owned).length;
	  const totalCount = currentSetCards.length;
	  const pct = totalCount > 0 ? Math.round((ownedCount / totalCount) * 100) : 0;
	  document.getElementById("progress-bar").style.width = `${pct}%`;
	  document.getElementById("progress-text").textContent = `${ownedCount}/${totalCount} (${pct}%)`;

	  const grid = document.getElementById("card-grid");
	  if (filtered.length === 0) {
		grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 text-sm">No cards match the filters in this set.</div>`;
		return;
	  }

	  // Paginate to keep rendering fast
	  const visibleCards = filtered.slice(0, currentPage * CARDS_PER_PAGE);

	  const cardMarkup = visibleCards.map(card => {
		const foilStyle = 
		  card.foil === "Reverse Holo" ? "bg-sky-500/10 text-sky-400 border-sky-500/20" :
		  card.foil === "Holo" ? "bg-purple-500/10 text-purple-400 border-purple-500/20" :
		  "bg-slate-800 text-slate-400 border-slate-700";

		const imgSrc = getCardImageSrc(card);
		const priceDisplay = card.market_price ? `$${Number(card.market_price).toFixed(2)}` : "—";

		return `
		  <div class="relative bg-slate-900 border ${card.owned ? 'border-amber-400/50' : 'border-slate-800'} rounded-xl p-3 flex flex-col justify-between transition hover:border-slate-700">
			
			<!-- Card Image -->
			<div class="aspect-[3/4] bg-slate-950 rounded-lg overflow-hidden flex items-center justify-center mb-2.5 relative border border-slate-800/80">
			  ${imgSrc 
				? `<img 
					src="${imgSrc}" 
					alt="${card.name}" 
					loading="lazy" 
					decoding="async"
					class="w-full h-full object-contain transition-opacity duration-200 ${!card.owned ? 'opacity-35 grayscale contrast-75' : 'opacity-100'}"
				  />`
				: `<div class="text-xs text-slate-500 font-mono text-center p-2">${card.name}<br>${card.cardNumber}</div>`
			  }
			</div>

			<div>
			  <div class="flex items-center justify-between gap-1 mb-1.5">
				<span class="text-[11px] font-mono text-slate-400">${card.cardNumber}</span>
				<span class="text-[10px] font-medium px-2 py-0.5 rounded border ${foilStyle}">${card.foil}</span>
			  </div>
			  <h2 class="text-sm font-bold text-white truncate mb-0.5">${card.name}</h2>
			  <div class="flex items-center justify-between text-[11px] text-slate-500 mb-3">
				<span>${card.rarity}</span>
				<span class="text-emerald-400 font-medium">${priceDisplay}</span>
			  </div>
			</div>

			<!-- Global window.toggleCard call -->
			<button 
			  type="button"
			  onclick="window.toggleCard('${card.set.replace(/'/g, "\\'")}', ${card.rowIndex}, ${card.owned})"
			  class="w-full py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer select-none ${
				card.owned 
				  ? 'bg-amber-400 text-slate-950 hover:bg-amber-300' 
				  : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
			  }">
			  ${card.owned ? '✓ Owned' : '+ Add'}
			</button>
		  </div>
		`;
	  }).join('');

	  const loadMoreButton = filtered.length > visibleCards.length 
		? `
		  <div class="col-span-full py-6 flex justify-center">
			<button id="load-more-btn" class="px-6 py-2.5 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition">
			  Load More Cards (${visibleCards.length} of ${filtered.length})
			</button>
		  </div>
		`
		: '';

	  grid.innerHTML = cardMarkup + loadMoreButton;

	  const btn = document.getElementById("load-more-btn");
	  if (btn) {
		btn.onclick = () => {
		  currentPage++;
		  renderCards();
		};
	  }
	}

	// ==========================================
	// 6. INITIALIZATION & LISTENERS
	// ==========================================
	async function init() {
	  try {
		const res = await fetch(SCRIPT_URL);
		const data = await res.json();
		if (data.status === "success") {
		  allCards = data.cards;
		  sets = data.sets;
		  activeSet = sets[0] || "";
		  renderTabs();
		  renderCards();
		} else {
		  document.getElementById("card-grid").innerHTML = 
			`<div class="col-span-full py-12 text-center text-rose-400 text-sm">Error: ${data.message}</div>`;
		}
	  } catch (err) {
		document.getElementById("card-grid").innerHTML = 
		  `<div class="col-span-full py-12 text-center text-rose-400 text-sm">Error connecting to Google Sheets: ${err.message}</div>`;
	  }
	}

	document.getElementById("search").addEventListener("input", () => { currentPage = 1; renderCards(); });
	document.getElementById("owned-filter").addEventListener("change", () => { currentPage = 1; renderCards(); });
	document.getElementById("foil-filter").addEventListener("change", () => { currentPage = 1; renderCards(); });

	init();
  </script>
</body>
</html>
