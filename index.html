<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Card Collection Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans">
  <div class="max-w-6xl mx-auto">
	
	<!-- Top Bar -->
	<header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
	  <div>
		<h1 class="text-3xl font-black tracking-tight text-amber-400">⚡ Pokémon Card Vault</h1>
		<p class="text-slate-400 text-sm mt-0.5">Live two-way sync with Google Sheets</p>
	  </div>

	  <!-- Set Progress & Live Portfolio Valuation -->
	  <div class="w-full sm:w-80 bg-slate-900 border border-slate-800 p-3.5 rounded-xl flex flex-col gap-2.5">
		<div>
		  <div class="flex justify-between text-xs font-semibold mb-1.5">
			<span id="progress-label" class="text-slate-400">Set Completion</span>
			<span id="progress-text" class="text-amber-400 font-mono">0/0 (0%)</span>
		  </div>
		  <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
			<div id="progress-bar" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%"></div>
		  </div>
		</div>

		<div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
		  <div>
			<span class="text-slate-500 block text-[10px] uppercase tracking-wider font-semibold">Your Value</span>
			<span id="portfolio-owned-val" class="text-emerald-400 font-bold font-mono text-sm">$0.00</span>
		  </div>
		  <div class="text-right">
			<span class="text-slate-500 block text-[10px] uppercase tracking-wider font-semibold">Master Set Value</span>
			<span id="portfolio-total-val" class="text-slate-400 font-semibold font-mono text-sm">$0.00</span>
		  </div>
		</div>
	  </div>
	</header>

	<!-- Set Navigation Tabs -->
	<div id="set-tabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 border-b border-slate-800 scrollbar-none">
	  <span class="text-xs text-slate-500 py-1.5">Loading sets...</span>
	</div>

	<!-- Controls: Search & Variant Filters -->
	<div class="flex flex-col sm:flex-row gap-3 mb-6">
	  <input 
		id="search" 
		type="text" 
		placeholder="Search card name or number (e.g. 001/086)..." 
		class="flex-1 bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 placeholder:text-slate-500"
	  />
	  <select id="owned-filter" class="bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 text-slate-300">
		<option value="all">All Status</option>
		<option value="owned">Owned Only</option>
		<option value="missing">Missing Only</option>
	  </select>
	  <select id="foil-filter" class="bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 text-slate-300">
		<option value="all">All Variants</option>
		<option value="Standard">Standard</option>
		<option value="Reverse Holo">Reverse Holo</option>
		<option value="Holo">Holo</option>
	  </select>
	</div>

	<!-- Card Grid -->
	<div id="card-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
	  <div class="col-span-full py-16 text-center text-slate-500 text-sm">Connecting to Google Sheets...</div>
	</div>
  </div>

  <script>
	// ==========================================
	// 1. CONFIGURATION & STATE
	// ==========================================
	const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhCGRmOFESJPMGkEGpejCzD6rx26dn7QU0lPUhR8Bfw-2S2ZVIkOt6RJQGnCpmrWpDbA/exec";

	// Known TCGdex Set IDs
	const SET_ID_MAP = {
	  "Pitch Black": "me05",
	  "Perfect Order": "me03",
	  "Chaos Rising": "me04",
	  "Surging Sparks": "sv08",
	  "Journey Together": "sv09",
	  "Destined Rivals": "sv07"
	};

	let allCards = [];
	let sets = [];
	let activeSet = "";
	const CARDS_PER_PAGE = 40;
	let currentPage = 1;

	// Cache stores
	const detailedCardCache = {};
	const setCardIndexCache = {};
	let tcgdexSetsList = null;

	function cleanCardNum(val) {
	  if (!val) return "";
	  const firstPart = String(val).split("/")[0].trim().toLowerCase();
	  return firstPart.replace(/^0+/, "") || "0";
	}

	// ==========================================
	// 2. TOGGLE CARD (GOOGLE SHEETS SYNC)
	// ==========================================
	async function toggleCard(set, rowIndex, currentStatus) {
	  console.log(`[Toggle] Set: "${set}", Row: ${rowIndex}, Current: ${currentStatus}`);

	  const target = allCards.find(c => c.set.trim() === set.trim() && Number(c.rowIndex) === Number(rowIndex));
	  if (!target) {
		console.error("Target card not found in memory!", { set, rowIndex });
		return;
	  }

	  const nextStatus = !currentStatus;

	  target.owned = nextStatus;
	  renderCards();

	  try {
		const payload = JSON.stringify({
		  set: set,
		  rowIndex: Number(rowIndex),
		  owned: nextStatus
		});

		const res = await fetch(SCRIPT_URL, {
		  method: "POST",
		  headers: { "Content-Type": "text/plain;charset=utf-8" },
		  body: payload,
		  redirect: "follow"
		});

		const result = await res.json();
		console.log("Sheet update response:", result);
	  } catch (err) {
		console.error("Sync failed:", err);
		target.owned = currentStatus;
		renderCards();
	  }
	}

	// ==========================================
	// 3. SET SWITCHING & STEP-BY-STEP PRICING
	// ==========================================
	async function switchSet(setName) {
	  activeSet = setName;
	  currentPage = 1;
	  renderTabs();
	  renderCards();

	  await loadPricesForSet(setName);
	}

	async function resolveSetId(setName) {
	  // Direct lookup from known map
	  if (SET_ID_MAP[setName]) {
		return SET_ID_MAP[setName];
	  }

	  // Step 1: Call https://api.tcgdex.net/v2/en/sets/
	  if (!tcgdexSetsList) {
		try {
		  const res = await fetch("https://api.tcgdex.net/v2/en/sets/");
		  tcgdexSetsList = res.ok ? await res.json() : [];
		} catch (e) {
		  console.warn("[Price API] Could not load global set index:", e);
		  tcgdexSetsList = [];
		}
	  }

	  // Step 2: Loop through all sets to find matching object
	  const cleanTarget = setName.toLowerCase().replace(/[^a-z0-9]/g, "");
	  const matched = tcgdexSetsList.find(s => {
		const sName = (s.name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
		const sId = (s.id || "").toLowerCase().replace(/[^a-z0-9]/g, "");
		return sName === cleanTarget || sId === cleanTarget || sName.includes(cleanTarget);
	  });

	  return matched ? matched.id : null;
	}

	async function loadPricesForSet(setName) {
	  try {
		console.log(`[Price API] Initiating pipeline for set: "${setName}"...`);

		// Step 2 & 3: Find set ID
		const resolvedSetId = await resolveSetId(setName);
		if (!resolvedSetId) {
		  console.warn(`[Price API] Could not resolve set ID for "${setName}".`);
		  return;
		}

		console.log(`[Price API] Set "${setName}" resolved to ID: "${resolvedSetId}"`);

		// Step 3 & 4: Append set ID to /sets/{setID} to get cards array
		let cardsList = setCardIndexCache[setName];
		if (!cardsList) {
		  const detailRes = await fetch(`https://api.tcgdex.net/v2/en/sets/${resolvedSetId}`);
		  if (!detailRes.ok) {
			console.warn(`[Price API] /sets/${resolvedSetId} returned HTTP ${detailRes.status}`);
			return;
		  }
		  const detailData = await detailRes.json();
		  cardsList = detailData.cards || [];
		  setCardIndexCache[setName] = cardsList;
		}

		console.log(`[Price API] Set "${resolvedSetId}" returned ${cardsList.length} cards.`);

		// Step 4, 5, 6: Batch fetch /cards/{setID-cardID}
		const BATCH_SIZE = 10;
		for (let i = 0; i < cardsList.length; i += BATCH_SIZE) {
		  if (activeSet !== setName) {
			console.log(`[Price API] Tab switched; stopping pricing fetch for "${setName}".`);
			break;
		  }

		  const chunk = cardsList.slice(i, i + BATCH_SIZE);

		  const fetchPromises = chunk.map(async (stub) => {
			const cardFullId = stub.id; // e.g. "me03-001" or "sv08-001"
			if (!cardFullId) return null;

			if (detailedCardCache[cardFullId]) {
			  return detailedCardCache[cardFullId];
			}

			try {
			  // Step 5 & 6: Call https://api.tcgdex.net/v2/en/cards/{cardFullId}
			  const cardRes = await fetch(`https://api.tcgdex.net/v2/en/cards/${cardFullId}`);
			  if (cardRes.ok) {
				const cardObj = await cardRes.json();
				detailedCardCache[cardFullId] = cardObj;
				return cardObj;
			  }
			} catch (e) {
			  console.warn(`[Price API] Failed to fetch card ${cardFullId}:`, e);
			}
			return null;
		  });

		  const resolvedCards = await fetchPromises;

		  // Step 7: Loop through response to get pricing & match to Google Sheet cards
		  let updatedAny = false;
		  resolvedCards.forEach(cardObj => {
			if (!cardObj) return;

			const apiCleanNum = cleanCardNum(cardObj.localId || cardObj.id);
			const apiName = (cardObj.name || "").toLowerCase().trim();

			allCards.forEach(c => {
			  if (c.set === setName) {
				const sheetCleanNum = cleanCardNum(c.cardNumber);
				const sheetName = (c.name || "").toLowerCase().trim();

				const isMatch = (sheetCleanNum && apiCleanNum && sheetCleanNum === apiCleanNum) ||
								(sheetName && apiName && sheetName === apiName);

				if (isMatch && (c.market_price === null || c.market_price === undefined)) {
				  const price = extractPriceFromCard(cardObj, c.foil);
				  if (price !== null) {
					c.market_price = price;
					updatedAny = true;
				  }
				}
			  }
			});
		  });

		  if (updatedAny && activeSet === setName) {
			renderCards();
		  }
		}

		console.log(`[Price API] Pricing pipeline completed for: "${setName}"`);

	  } catch (err) {
		console.warn(`[Price API Error] Failed to process cards for "${setName}":`, err);
	  }
	}

	// Step 7 helper: parse pricing object
	function extractPriceFromCard(cardObj, foilType) {
	  if (!cardObj) return null;

	  const tcg = cardObj.pricing?.tcgplayer || cardObj.variants;
	  if (!tcg) return null;

	  const foil = (foilType || "").toLowerCase();

	  const getVal = (obj) => {
		if (!obj) return null;
		if (typeof obj === 'number') return obj;
		return obj.marketPrice || obj.market || obj.midPrice || obj.mid || obj.directLowPrice || obj.lowPrice || null;
	  };

	  if (foil.includes("reverse")) {
		const rev = getVal(tcg.reverseHolo || tcg.reverse || tcg["reverse-holo"]);
		if (rev !== null) return rev;
	  }
	  if (foil.includes("holo")) {
		const holo = getVal(tcg.holofoil || tcg.holo);
		if (holo !== null) return holo;
	  }

	  const norm = getVal(tcg.normal || tcg.standard);
	  if (norm !== null) return norm;

	  return getVal(tcg.normal) || getVal(tcg.holofoil) || getVal(tcg.reverseHolo) || getVal(tcg.reverse) || null;
	}

	function renderTabs() {
	  const container = document.getElementById("set-tabs");
	  container.innerHTML = sets.map(setName => {
		const isActive = setName === activeSet;
		return `
		  <button 
			type="button"
			data-set="${encodeURIComponent(setName)}"
			class="set-tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
			  isActive 
				? 'bg-amber-400 text-slate-950 shadow' 
				: 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
			}">
			${setName}
		  </button>
		`;
	  }).join('');
	}

	// ==========================================
	// 4. IMAGE PATH RESOLUTION
	// ==========================================
	function getCardImageSrc(card) {
	  if (card.image_url) return card.image_url;

	  const setFolders = {
		"Journey Together": "CardImages/journey-together-images",
		"Destined Rivals": "CardImages/destined-rivals-images",
		"Perfect Order": "CardImages/perfect-order-images",
		"Pitch Black": "CardImages/pitch-black-images",
		"Surging Sparks": "CardImages/surging-sparks-images",
		"Chaos Rising": "CardImages/chaos-rising-images"
	  };

	  const folder = setFolders[card.set ? card.set.trim() : ""];
	  if (!folder || !card.cardNumber) return "";

	  const cleanNum = cleanCardNum(card.cardNumber);
	  const foilNorm = (card.foil || "standard")
		.trim()
		.toLowerCase()
		.replace(/\s+/g, "_");

	  return `${folder}/${cleanNum}_${foilNorm}.png`;
	}

	// ==========================================
	// 5. CARD RENDERING & VALUATION
	// ==========================================
	function renderCards() {
	  const query = document.getElementById("search").value.toLowerCase();
	  const ownedFilter = document.getElementById("owned-filter").value;
	  const foilFilter = document.getElementById("foil-filter").value;

	  const currentSetCards = allCards.filter(c => c.set === activeSet);

	  const filtered = currentSetCards.filter(c => {
		const matchesQuery = c.name.toLowerCase().includes(query) || c.cardNumber.toLowerCase().includes(query);
		const matchesOwned = ownedFilter === "all" ? true : ownedFilter === "owned" ? c.owned : !c.owned;
		const matchesFoil = foilFilter === "all" ? true : c.foil.toLowerCase() === foilFilter.toLowerCase();
		return matchesQuery && matchesOwned && matchesFoil;
	  });

	  const ownedCards = currentSetCards.filter(c => c.owned);
	  const ownedCount = ownedCards.length;
	  const totalCount = currentSetCards.length;
	  const pct = totalCount > 0 ? Math.round((ownedCount / totalCount) * 100) : 0;
	  document.getElementById("progress-bar").style.width = `${pct}%`;
	  document.getElementById("progress-text").textContent = `${ownedCount}/${totalCount} (${pct}%)`;

	  const ownedValue = ownedCards.reduce((sum, c) => sum + (Number(c.market_price) || 0), 0);
	  const totalSetValue = currentSetCards.reduce((sum, c) => sum + (Number(c.market_price) || 0), 0);

	  const ownedValEl = document.getElementById("portfolio-owned-val");
	  const totalValEl = document.getElementById("portfolio-total-val");

	  if (ownedValEl) {
		ownedValEl.textContent = `$${ownedValue.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
	  }
	  if (totalValEl) {
		totalValEl.textContent = `$${totalSetValue.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
	  }

	  const grid = document.getElementById("card-grid");
	  if (filtered.length === 0) {
		grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 text-sm">No cards match the filters in this set.</div>`;
		return;
	  }

	  const visibleCards = filtered.slice(0, currentPage * CARDS_PER_PAGE);

	  const cardMarkup = visibleCards.map(card => {
		const foilStyle = 
		  card.foil === "Reverse Holo" ? "bg-sky-500/10 text-sky-400 border-sky-500/20" :
		  card.foil === "Holo" ? "bg-purple-500/10 text-purple-400 border-purple-500/20" :
		  "bg-slate-800 text-slate-400 border-slate-700";

		const imgSrc = getCardImageSrc(card);
		const priceDisplay = (card.market_price !== null && card.market_price !== undefined) 
		  ? `$${Number(card.market_price).toFixed(2)}` 
		  : "—";

		return `
		  <div class="relative bg-slate-900 border ${card.owned ? 'border-amber-400/50' : 'border-slate-800'} rounded-xl p-3 flex flex-col justify-between transition hover:border-slate-700">
			
			<!-- Card Image -->
			<div class="aspect-[3/4] bg-slate-950 rounded-lg overflow-hidden flex items-center justify-center mb-2.5 relative border border-slate-800/80">
			  ${imgSrc 
				? `<img 
					src="${imgSrc}" 
					alt="${card.name}" 
					loading="lazy" 
					decoding="async"
					class="w-full h-full object-contain transition-opacity duration-200 ${!card.owned ? 'opacity-35 grayscale contrast-75' : 'opacity-100'}"
					onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
				  />
				  <div class="hidden text-xs text-slate-500 font-mono text-center p-2">${card.name}<br>${card.cardNumber}</div>`
				: `<div class="text-xs text-slate-500 font-mono text-center p-2">${card.name}<br>${card.cardNumber}</div>`
			  }
			</div>

			<div>
			  <div class="flex items-center justify-between gap-1 mb-1.5">
				<span class="text-[11px] font-mono text-slate-400">${card.cardNumber}</span>
				<span class="text-[10px] font-medium px-2 py-0.5 rounded border ${foilStyle}">${card.foil}</span>
			  </div>
			  <h2 class="text-sm font-bold text-white truncate mb-0.5">${card.name}</h2>
			  <div class="flex items-center justify-between text-[11px] text-slate-500 mb-3">
				<span>${card.rarity}</span>
				<span class="text-emerald-400 font-medium font-mono">${priceDisplay}</span>
			  </div>
			</div>

			<!-- Card Toggle Button -->
			<button 
			  type="button"
			  data-set="${encodeURIComponent(card.set)}"
			  data-row="${card.rowIndex}"
			  data-owned="${card.owned}"
			  class="toggle-card-btn w-full py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer select-none ${
				card.owned 
				  ? 'bg-amber-400 text-slate-950 hover:bg-amber-300' 
				  : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
			  }">
			  ${card.owned ? '✓ Owned' : '+ Add'}
			</button>
		  </div>
		`;
	  }).join('');

	  const loadMoreButton = filtered.length > visibleCards.length 
		? `
		  <div class="col-span-full py-6 flex justify-center">
			<button id="load-more-btn" type="button" class="px-6 py-2.5 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition cursor-pointer">
			  Load More Cards (${visibleCards.length} of ${filtered.length})
			</button>
		  </div>
		`
		: '';

	  grid.innerHTML = cardMarkup + loadMoreButton;
	}

	// ==========================================
	// 6. EVENT DELEGATION
	// ==========================================
	document.getElementById("card-grid").addEventListener("click", (e) => {
	  const loadMore = e.target.closest("#load-more-btn");
	  if (loadMore) {
		currentPage++;
		renderCards();
		return;
	  }

	  const btn = e.target.closest(".toggle-card-btn");
	  if (!btn) return;

	  const set = decodeURIComponent(btn.dataset.set);
	  const rowIndex = Number(btn.dataset.row);
	  const isOwned = btn.dataset.owned === "true";

	  toggleCard(set, rowIndex, isOwned);
	});

	document.getElementById("set-tabs").addEventListener("click", (e) => {
	  const tabBtn = e.target.closest(".set-tab-btn");
	  if (!tabBtn) return;
	  const setName = decodeURIComponent(tabBtn.dataset.set);
	  switchSet(setName);
	});

	// ==========================================
	// 7. INITIALIZATION & FILTERS
	// ==========================================
	async function init() {
	  try {
		const res = await fetch(SCRIPT_URL);
		const data = await res.json();
		if (data.status === "success") {
		  allCards = data.cards;
		  sets = data.sets;
		  activeSet = sets[0] || "";
		  renderTabs();
		  renderCards();

		  if (activeSet) {
			loadPricesForSet(activeSet);
		  }
		} else {
		  document.getElementById("card-grid").innerHTML = 
			`<div class="col-span-full py-12 text-center text-rose-400 text-sm">Error: ${data.message}</div>`;
		}
	  } catch (err) {
		document.getElementById("card-grid").innerHTML = 
		  `<div class="col-span-full py-12 text-center text-rose-400 text-sm">Error connecting to Google Sheets: ${err.message}</div>`;
	  }
	}

	document.getElementById("search").addEventListener("input", () => { currentPage = 1; renderCards(); });
	document.getElementById("owned-filter").addEventListener("change", () => { currentPage = 1; renderCards(); });
	document.getElementById("foil-filter").addEventListener("change", () => { currentPage = 1; renderCards(); });

	init();
  </script>
</body>
</html>
